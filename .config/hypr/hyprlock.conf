$wall = $HOME/.config/hypr/wallpapers/wallpaper3.png

# BACKGROUND
background {
  monitor =  DP-2
  path = $wall
  blur_passes = 0
}

# GENERAL
general {
  no_fade_in = true
  grace = 0
  disable_loading_bar = false
}

# Profie-Photo
image {
    monitor = DP-2
    path = ~/user.png
    border_color = rgb(49, 50, 68)
    border_size = 2
    size = 100
    rounding = 0
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 170
    halign = center
    valign = center
}

# NAME
label {
    monitor = DP-2
    text = $USER
    color = rgb(205, 214, 244)
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 20
    position = 0, 80
    halign = center
    valign = center
    font_family = JetBrains Mono
}

# Time
label {
    monitor = DP-2
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgb(205, 214, 244)
    font_size = 60
    position = 0, -20
    halign = center
    valign = center
    font_family = JetBrains Mono
}

# Day-Month-Date
label {
    monitor = DP-2
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgb(205, 214, 244)
    font_size = 19
    position = 0, -90
    halign = center
    valign = center
    font_family = JetBrains Mono
}

# Main-Box
shape {
    monitor = DP-2
    size = 800, 600
    color = rgb(30, 30, 46)
    border_color = rgb(49, 50, 68)
    border_size = 2
    rounding = 0
    rotate = 0
    xray = false 
    position = 0, 0
    halign = center
    valign = center
}

# User Box

shape {
    monitor = DP-2
    size = 770, 500
    position = 0, 35
    color = rgb(30, 30, 46)
    border_color = rgb(49, 50, 68)
    border_size = 2
  }

# INPUT FIELD
input-field {
    monitor = DP-2
    size = 770, 50
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(49, 50, 68)
    inner_color = rgb(30, 30, 46)
    font_color = rgb(205, 214, 244)
    check_color = rgb(49, 50, 68)
    fail_color = rgb(243, 139, 168)
    fade_on_empty = false
    placeholder_text = <i><span foreground="##cdd6f4ff">   Enter Pass</span></i>
    hide_input = false
    position = 0, -260
    halign = center
    valign = center
    rounding = 0
    font_family = JetBrains Mono
}
